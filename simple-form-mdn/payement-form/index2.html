<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Payement Form</title>
    <link rel="sylesheet" href="style.css">
  </head>
  <body>
    <form action="./form_handler" method="post">
        <h1>Payement Form</h1>
        <p>Please complete all required (*) feilds</p>
    
    <section>
        <h2> Contact Information</h2>
        <fieldset>
            <legend>Title</legend>
            <ul>
                <li><label for="title_1"><input type="radio" name="title" id="title_1" value="A">
                Ace</label></li>
               <li><label for="title_2"><input type="radio" name="title" id="title_2" value="K">
                King</label></li>
                <li><label for="title_3"><input type="radio" name="title" id="title_3" value="Q">
                Queen</label></li>
                </ul>
        </fieldset>
        
        <p><label for="name"></label>Name *<input type="text" name="username" id="name" required></p>
        <p><label for="mail"></label>Email *<input type="text" name="user-mail" id="mail" required></p>
        <p><label for="pwd"></label>Password *<input type="text" name="password" id="pwd" required></p>
    </section>
    <section>
  <h2>Payment information</h2>
  <p>
    <label for="card">
      <span>Card type:</span>
    </label>
    <select id="card" name="user-card">
      <option value="visa">Visa</option>
      <option value="mc">Mastercard</option>
      <option value="amex">American Express</option>
    </select>
  </p>
  <p>
    <label for="number">Card number *:</label>
    <input type="tel" id="number" name="card-number" required />
  </p>
  <p>
    <label for="expiration">Expiration date *:</label>
    <input
      type="text"
      id="expiration"
      name="expiration"
      required
      placeholder="MM/YY"
      pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" />
  </p>
</section>
<section>
  <p>
    <button type="submit">Validate the payment</button>
  </p>
</section>
</form> 
<style>
    h1 {
  margin-top: 0;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

form {
  margin: 0 auto;
  width: 400px;
  padding: 1em;
  border: 1px solid #cccccc;
  border-radius: 1em;
}

label span {
  display: inline-block;
  text-align: right;
}

input,
fieldset {
  font: 1em sans-serif;
  width: 250px;
  box-sizing: border-box;
  border: 1px solid #999999;
}

input[type="checkbox"],
input[type="radio"] {
  width: auto;
  border: none;
}

input:focus {
  background-color: yellow;
}

button {
  margin-top: 20px;
}

label {
  display: inline-block;
}

p label {
  width: 100%;
}
</style>
  </body>
</html>
